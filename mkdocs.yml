site_name: Chaos Mod Wiki
site_url: https://notmarsim.github.io/chaos-mod-wiki/
site_description: 'Machines, Realities and dimensional anomalies · Máquinas, Realities e anomalias dimensionais'
site_author: marsim
docs_dir: docs
site_dir: site
use_directory_urls: true
theme:
  name: mkdocs
  color_mode: dark
  user_color_mode_toggle: true
  nav_style: dark
  locale: en
plugins:
  - search:
      lang: [en, pt]
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
extra_css:
  - assets/wiki.css
nav:
  - 'Choose your language / Escolha seu idioma': index.md
  - English:
      - Overview: en/index.md
      - Getting started: en/getting-started.md
      - Progression and materials: en/progression.md
      - Energy and automation: en/energy.md
      - Machines and upgrades: en/machines.md
      - Controller and calibration: en/controller.md
      - Nova Reactor: en/reactor.md
      - Zenith Accelerator: en/accelerator.md
      - Gateway: en/gateway.md
      - Realities and stability: en/realities.md
      - Reality Extractor and Chaos: en/extractor.md
      - Reality Rifts and Scars: en/rifts.md
      - Dimensional Breaches: en/breaches.md
      - Creatures: en/creatures.md
      - Key recipes: en/recipes.md
      - FAQ and commands: en/faq.md
  - Português:
      - Visão geral: pt/index.md
      - Primeiros passos: pt/getting-started.md
      - Progressão e materiais: pt/progression.md
      - Energia e automação: pt/energy.md
      - Máquinas e upgrades: pt/machines.md
      - Controller e calibração: pt/controller.md
      - Nova Reactor: pt/reactor.md
      - Zenith Accelerator: pt/accelerator.md
      - Gateway: pt/gateway.md
      - Realities e estabilidade: pt/realities.md
      - Reality Extractor e Chaos: pt/extractor.md
      - Reality Rifts e Scars: pt/rifts.md
      - Dimensional Breaches: pt/breaches.md
      - Criaturas: pt/creatures.md
      - Receitas principais: pt/recipes.md
      - Dúvidas e comandos: pt/faq.md
